name: Build IPK

# CI runs on GitHub-hosted Ubuntu. Steps use JavaScript-based Actions (checkout,
# upload-artifact) — that is GitHub's runner stack, not a Node dependency of mwan6-npt.
# The package itself is shell + make only.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-ipk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IPK package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
            make -f Makefile.build ipk PROJECT_VERSION="$ver"
          else
            make -f Makefile.build ipk
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwan6-npt-ipk
          path: dist/*.ipk
          retention-days: 30

  # Optional: attach IPK to an existing GitHub Release when a version tag is pushed.
  # Create the release (title/notes) manually or via `gh release create`; this job only uploads the file.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-ipk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IPK package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          make -f Makefile.build ipk PROJECT_VERSION="$ver"
          ls -la dist/

      - name: Upload IPK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          overwrite_files: true
          # Do not call generate_release_notes — needs extra API scope and fails with default token
